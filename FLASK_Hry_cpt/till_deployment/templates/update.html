{% extends 'base.html' %}
{% block title %}
    Update Page
{% endblock title %}
{% block body %}
        <div class="container my-3">
        <form action="/update/{{todo3_html.sno}}" method="post">
            <div class="form-group">
                <label for="title">Update title</label>
                <input type="text" class="form-control" name="title1" value="{{todo3_html.title}}" id="title" aria-describedby="emailHelp">
                <small id="emailHelp" class="form-text text-muted"></small>
            </div>
            <div class="form-group">
                <label for="desc">Update Description</label>
                <input type="text" name="desc1" class="form-control" value="{{todo3_html.desc}}" id="desc">
            </div>
            <button type="submit" class="btn btn-outline-dark">UPDATE</button>
        </form>
    </div>
{% endblock body %}
