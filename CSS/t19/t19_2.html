<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        .box1{
            height: 100px;
            font-family: "Playfair Display", serif;
        }

        .box2{
            height: 100px;
             font-family: "Poppins", sans-serif;
        }

        .box3{
            height: 100px;
            font-family: "Baloo Bhai 2", sans-serif;
        }

        h1{
            font-family:"Poppins", sans-serif ;

            text-decoration:underline;
            text-decoration-style:wavy;
            text-decoration-color: brown;
            text-decoration-thickness: 10px;

            text-indent: 30px;
        }

        p{
            line-height: 25px;
            width: 40px;
            border: 2px solid red;
            overflow: hidden;
            text-overflow: clip;
        }
    </style>
</head>

<body>
    <h1>Font Family, size and all</h1>
    <div class="box box1">I am div1</div>
    <div class="box box2">I am div2</div>
    <div class="box box3">I am div3</div>
    <p>I am Saumya Pandey. 2nd Year student of B.S. in Data Science at IIT Madras.</p>

</html>
